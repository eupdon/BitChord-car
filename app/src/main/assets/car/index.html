<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1f1f1f" />
  <title>BitChord</title>
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script>window.CAR_TOKEN = "__TOKEN__";</script>
</head>
<body>
  <svg class="defs" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5L8 12l10 7zM5 5h2.5v14H5z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5l10 7L6 19zM16.5 5H19v14h-2.5z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/><text x="12" y="16" font-size="9" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">1</text></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 000-7.8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l4 14-2 .6L15 6z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4zM15 9a5 5 0 010 6M18 6a9 9 0 010 12"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="/logo-mark.svg" alt="" />
        <span>BitChord</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="home"><svg class="icon"><use href="#i-home"/></svg><span>홈</span></button>
        <button class="nav-item" data-page="search"><svg class="icon"><use href="#i-search"/></svg><span>검색</span></button>
        <button class="nav-item" data-page="library"><svg class="icon"><use href="#i-library"/></svg><span>라이브러리</span></button>
      </nav>
      <div class="sidebar-foot">
        <span class="dot" id="dot"></span>
        <span id="status">연결 중…</span>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn only-narrow" id="backBtn" title="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <div class="crumb" id="crumb">홈</div>
      </header>

      <div class="pages" id="pages">
        <section class="page active" data-page="home">
          <div class="home-head">
            <div class="eyebrow">HOME</div>
            <h1>오늘의 음악</h1>
            <div class="home-sub">폰에서 불러온 맞춤 추천과 최근 재생 목록</div>
          </div>
          <div class="home-shelves" id="homeShelves">
            <div class="empty">폰에서 홈 피드를 불러오는 중…</div>
          </div>
        </section>

        <section class="page" data-page="search">
          <div class="page-head">
            <div class="eyebrow">검색</div>
            <h1>무엇을 들으시겠어요?</h1>
          </div>
          <div class="search-field">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="q" type="search" placeholder="곡, 아티스트, 앨범" autocomplete="off" />
            <span class="hint" id="searchHint">폰에서 검색합니다</span>
          </div>
          <div class="chips" id="searchChips">
            <button class="chip active" data-filter="ALL">전체</button>
            <button class="chip" data-filter="SONGS">곡</button>
            <button class="chip" data-filter="VIDEOS">뮤직비디오</button>
            <button class="chip" data-filter="ALBUMS">앨범</button>
            <button class="chip" data-filter="ARTISTS">아티스트</button>
            <button class="chip" data-filter="PLAYLISTS">플레이리스트</button>
          </div>
          <div class="search-content" id="results">
            <div class="empty">검색어를 입력하세요.</div>
          </div>
        </section>

        <section class="page" data-page="library">
          <div class="page-head">
            <div class="eyebrow">라이브러리</div>
            <h1>라이브러리</h1>
          </div>
          <div class="library-sections" id="librarySections">
            <div class="empty">폰에서 라이브러리를 불러오는 중…</div>
          </div>
        </section>

        <section class="page" data-page="playlist">
          <div class="playlist-head" id="playlistHead"></div>
          <div class="track-list" id="playlistTracks"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="player-pill" id="playerPill">
    <button class="pill-open" id="pillOpen" title="플레이어 열기">
      <span class="pill-art"><img id="pillArtImg" alt="" /></span>
      <span class="pill-meta">
        <span class="pill-title" id="pillTitle">—</span>
        <span class="pill-artist" id="pillArtist">—</span>
      </span>
    </button>
    <div class="pill-track"><div id="pillBar"></div></div>
    <div class="pill-controls">
      <button class="mini" id="pillShuffle" title="셔플"><svg class="icon"><use href="#i-shuffle"/></svg></button>
      <button class="mini" id="pillPrev" title="이전"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button class="mini round" id="pillPlay" title="재생 / 일시정지"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="mini" id="pillNext" title="다음"><svg class="icon"><use href="#i-next"/></svg></button>
      <button class="mini" id="pillRepeat" title="반복"><svg class="icon"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="pill-volume">
      <svg class="icon"><use href="#i-volume"/></svg>
      <input type="range" id="volume" min="0" max="15" value="0" aria-label="볼륨" />
    </div>
    <button class="pill-up" id="pillUp" title="플레이어 열기"><svg class="icon"><use href="#i-up"/></svg></button>
  </div>

  <!-- Bottom player, raised upward: | 플레이어 | 가사(기본) / 재생목록 | -->
  <div class="player-sheet" id="playerSheet" aria-hidden="true">
    <div class="ps-bg" id="psBg"></div>
    <header class="ps-head">
      <button class="icon-btn" id="psClose" title="닫기"><svg class="icon"><use href="#i-down"/></svg></button>
      <div class="ps-heading">지금 재생</div>
    </header>
    <div class="ps-grid">
      <section class="ps-player">
        <img id="psArt" alt="album artwork" />
        <div class="ps-title" id="psTitle">—</div>
        <div class="ps-artist" id="psArtist">—</div>
        <div class="ps-seek">
          <span id="psPos" class="time">0:00</span>
          <input type="range" id="psSeek" min="0" max="1000" value="0" aria-label="재생 위치" />
          <span id="psDur" class="time">0:00</span>
        </div>
        <div class="ps-controls">
          <button class="ctrl" id="psShuffle" title="셔플"><svg class="icon"><use href="#i-shuffle"/></svg></button>
          <button class="ctrl" id="psPrev" title="이전 곡"><svg class="icon"><use href="#i-prev"/></svg></button>
          <button class="ctrl play" id="psPlay" title="재생 / 일시정지"><svg class="icon"><use href="#i-play"/></svg></button>
          <button class="ctrl" id="psNext" title="다음 곡"><svg class="icon"><use href="#i-next"/></svg></button>
          <button class="ctrl" id="psRepeat" title="반복"><svg class="icon"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="ps-actions">
          <button class="pill-btn" id="psLike"><svg class="icon"><use href="#i-heart"/></svg><span>좋아요</span></button>
        </div>
      </section>
      <section class="ps-side">
        <div class="tabs" id="psTabs">
          <button class="tab active" data-tab="lyrics">가사</button>
          <button class="tab" data-tab="queue">재생목록 <span id="psQueueCount"></span></button>
        </div>
        <div class="ps-body" id="psLyrics"><div class="empty">재생 중인 곡의 가사를 폰에서 불러옵니다.</div></div>
        <div class="ps-body hidden" id="psQueue"><div class="empty">재생목록이 비어 있습니다.</div></div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="banner hidden" id="banner">연결이 끊어졌습니다. 다시 연결하는 중…</div>

  <script src="/app.js"></script>
</body>
</html>
