name: Android Signed APK (Artifacts)

# Signed equivalent of the debug workflow: uses the repository's signing
# secrets, builds only the selected module(s), and uploads the finished APKs
# as ONE artifact bundle so the download behaves exactly like "Android Debug APK".
on:
  workflow_dispatch:
    inputs:
      build_phone:
        description: 'bitchord-phone (app)'
        type: boolean
        default: true
      build_wear:
        description: 'bitchord-wear (wearos)'
        type: boolean
        default: true

jobs:
  build-prod-release-signed:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
        printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties
        printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    - name: Verify signing secrets
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        if [ ! -s bitchord-release.jks ]; then
          echo "::error::bitchord-release.jks is EMPTY. Check KEYSTORE_BASE64 is a secret (not a variable)."
          exit 1
        fi
        file bitchord-release.jks
        keytool -list -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS"
        echo "Keystore OK"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build selected signed release APKs
      env:
        BUILD_PHONE: ${{ inputs.build_phone }}
        BUILD_WEAR: ${{ inputs.build_wear }}
      run: |
        set -euo pipefail
        TASKS=""
        if [ "$BUILD_PHONE" = "true" ]; then TASKS="$TASKS :app:assembleProdRelease"; fi
        if [ "$BUILD_WEAR" = "true" ]; then TASKS="$TASKS :wearos:assembleProdRelease"; fi
        if [ -z "$TASKS" ]; then
          echo "::error::No build target selected. Enable bitchord-phone and/or bitchord-wear in the workflow inputs."
          exit 1
        fi
        echo "Gradle tasks:$TASKS"
        ./gradlew $TASKS

    # Same staging shape as the debug workflow: the artifact zip contains only
    # the selected, finished APKs at its root, with no build/ directory noise.
    - name: Stage selected signed APKs for artifact
      env:
        BUILD_PHONE: ${{ inputs.build_phone }}
        BUILD_WEAR: ${{ inputs.build_wear }}
      run: |
        set -euo pipefail
        STAGE="$RUNNER_TEMP/bitchord-apks"
        rm -rf "$STAGE"
        mkdir -p "$STAGE"

        if [ "$BUILD_PHONE" = "true" ]; then
          PHONE_APK=$(find app/build/outputs/apk/prod/release -maxdepth 1 -name '*.apk' -type f -print -quit 2>/dev/null || true)
          if [ -z "$PHONE_APK" ]; then
            echo "::error::Signed phone release APK was not produced."
            exit 1
          fi
          cp "$PHONE_APK" "$STAGE/bitchord-phone-release-signed.apk"
        fi

        if [ "$BUILD_WEAR" = "true" ]; then
          WEAR_APK=$(find wearos/build/outputs/apk/prod/release -maxdepth 1 -name '*.apk' -type f -print -quit 2>/dev/null || true)
          if [ -z "$WEAR_APK" ]; then
            echo "::error::Signed Wear OS release APK was not produced."
            exit 1
          fi
          cp "$WEAR_APK" "$STAGE/bitchord-wear-release-signed.apk"
        fi

        if [ -z "$(ls -A "$STAGE")" ]; then
          echo "::error::Nothing was staged. No build target was selected."
          exit 1
        fi
        ls -lh "$STAGE"

    - name: Verify APK signatures
      run: |
        set -euo pipefail
        SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        SIGNER=""
        if [ -n "$SDK_DIR" ]; then
          SIGNER=$(find "$SDK_DIR/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
        fi
        if [ -z "$SIGNER" ]; then
          echo "::warning::apksigner not found; skipping signature verification."
          exit 0
        fi
        for apk in "$RUNNER_TEMP/bitchord-apks"/*.apk; do
          echo "---- $(basename "$apk") ----"
          "$SIGNER" verify --print-certs "$apk"
        done
        echo "All staged APKs are signed."

    - name: Upload signed APKs (single bundle)
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-signed-apks
        path: ${{ runner.temp }}/bitchord-apks
        if-no-files-found: error
        retention-days: 14
