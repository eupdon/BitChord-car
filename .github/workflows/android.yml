name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
        printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties
        printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    - name: Verify signing secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "KEYSTORE_BASE64 chars: ${#KEYSTORE_BASE64}"
        echo "KEYSTORE_PASSWORD chars: ${#KEYSTORE_PASSWORD}"
        echo "KEY_ALIAS: $KEY_ALIAS"
        echo "KEY_PASSWORD chars: ${#KEY_PASSWORD}"
        echo "jks bytes: $(wc -c < bitchord-release.jks)"
        if [ ! -s bitchord-release.jks ]; then
          echo "::error::bitchord-release.jks is EMPTY. Repository secret KEYSTORE_BASE64 is missing or was added as a Variable."
          exit 1
        fi
        file bitchord-release.jks
        keytool -list -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS"
        echo "Keystore OK"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
